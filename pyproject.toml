[build-system]
# torch is not listed here on purpose. Install with --no-build-isolation so the
# extension builds against the torch you already have. An isolated build
# downloads a second torch (~2 GB) that may not match the one you run with.
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sparsebench"
version = "0.1.0"
description = "Block-sparse MoE matmul kernels for A100 and H100"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.4"]

[project.optional-dependencies]
test = ["pytest>=8"]
# Optional baselines for bench/bench_baselines.py. Install with --no-deps (they pin
# their own torch / triton); the Colab notebook does this.
# ScatterMoE is not on PyPI: pip install git+https://github.com/shawntan/scattermoe.git@47b5e15
bench = ["stanford-stk", "grouped_gemm"]

[tool.setuptools]
packages = ["sparsebench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets tests import sparsebench without installing it (CPU-only machines).
pythonpath = ["."]
